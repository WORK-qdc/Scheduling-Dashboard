<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conference Scheduling Platform</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
    rel="stylesheet"
  />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <!-- Loading Bar -->
  <div class="loading" id="loading-bar"></div>

  <!-- Header -->
  <div class="main-header">
    <div class="container-fluid px-4">
      <div class="d-flex justify-content-between align-items-center">
        <h1><i class="bi bi-calendar-event me-3"></i>Conference Scheduling Platform</h1>
        <a href="/Scheduling-Dashboard/logout.html" class="btn logout-btn">
          <i class="bi bi-box-arrow-right me-2"></i>Logout
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content-wrapper container-fluid px-4">
    <!-- View Toggle -->
    <div class="text-center mb-1">
      <div class="view-toggle">
        <button class="view-btn active" id="list-view-btn">
          <i class="bi bi-list-ul me-2"></i>List View
        </button>
        <button class="view-btn" id="calendar-view-btn">
          <i class="bi bi-calendar3 me-2"></i>Calendar View
        </button>
      </div>
    </div>

    <!-- List View -->
    <div id="list-container" class="main-card">
      <!-- Filter Bar -->
      <div class="filter-bar d-flex align-items-center">
        <div class="dropdown">
          <button
            class="btn btn-outline-primary dropdown-toggle"
            type="button"
            id="filtersDropdownBtn"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-funnel me-1"></i> Filters
          </button>
          <div
            class="dropdown-menu p-3"
            aria-labelledby="filtersDropdownBtn"
            style="min-width: 260px;"
          >
            <!-- Speaker filter -->
            <div class="filter-group mb-2">
              <label class="mb-1">Speaker</label>
              <select id="employee-filter" class="form-select">
                <option value="">All Speakers</option>
              </select>
            </div>
            <!-- Month filter -->
            <div class="filter-group mb-2">
              <label class="mb-1">Month</label>
              <input id="start-date-filter" type="month" class="form-control" />
            </div>
            <div class="filter-group mb-2">
  <div class="filter-group mb-2">
  <label
    class="mb-1 text-nowrap"
    for="internal-external-filter"
  >
              <label class="mb-1">Internal / External</label>
  <select id="internal-external-filter" class="form-select">
    <option value="">All Types</option>
    <option value="Internal">Internal</option>
    <option value="External">External</option>
  </select>
</div>
          </div>
        </div>

        <!-- Keyword Search -->
        <div class="search-bar ms-3">
          <input
            type="text"
            id="keyword-search"
            class="form-control form-control-sm"
            placeholder="Search conferences…"
          />
        </div>

        <!-- Collapsed/Expanded Toggle -->
        <div class="ms-auto me-3" id="collapsed-toggle-container">
          <span
            class="text-primary fw-semibold toggle-collapsed-mode"
            role="button"
            id="collapsed-mode-toggle"
          >
            Expanded View
          </span>
        </div>

        <!-- Manage Speakers & Add Entry -->
        <div class="ms-auto d-flex align-items-center">
          <button
            type="button"
            id="edit-employees-btn"
            class="btn-manage me-2"
          >
            <i class="bi bi-people me-2"></i> Manage Speakers
          </button>
          <button
            type="button"
            id="open-add-entry-ui-btn"
            class="btn-add-new"
          >
            <i class="bi bi-plus-circle me-2"></i> Add Entry
          </button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table class="modern-table">
          <thead id="entries-thead"></thead>
          <tbody id="entries-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Calendar View -->
    <div id="calendar-container" class="main-card hidden">
      <div class="filter-bar d-flex align-items-center">
        <div class="dropdown">
          <button
            class="btn btn-outline-primary dropdown-toggle"
            type="button"
            id="calFiltersDropdownBtn"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-funnel me-1"></i> Filters
          </button>
          <div
            class="dropdown-menu p-3"
            aria-labelledby="calFiltersDropdownBtn"
            style="min-width: 220px;"
          >
            <div class="filter-group">
              <label class="mb-1">Speaker</label>
              <select id="calendar-employee-filter" class="form-select">
                <option value="">All Speakers</option>
              </select>
            </div>
          </div>
        </div>
        <div class="ms-auto">
          <button
            type="button"
            id="calendar-list-view-btn"
            class="btn-manage"
          >
            <i class="bi bi-arrow-left me-2"></i> Back to List
          </button>
        </div>
      </div>
      <div class="calendar-wrapper">
        <div id="calendar-table-wrapper"></div>
      </div>
    </div>
  </div>

  <!-- Employees Modal -->
  <div class="modal fade" id="employeeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-people me-2"></i>Employee Management
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <div class="modal-body">
          <button
            type="button"
            id="add-emp-btn"
            class="btn-add-new mb-3"
          >
            <i class="bi bi-person-plus me-2"></i>Add Employee
          </button>
          <table class="modern-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th width="100">Actions</th>
              </tr>
            </thead>
            <tbody id="employee-table-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Your Main JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.27.0/js/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/microsoft-graph-client/lib/graph-js-sdk-web.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="main.js"></script>

  <!-- Add Entry Modal -->
  <div class="modal fade" id="addEntryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title">Add New Conference</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <!-- Body / Form -->
        <div class="modal-body">
          <form id="add-entry-form" novalidate>
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label fw-bold">Title</label>
              <input
                type="text"
                id="new-title"
                class="form-control"
                required
              />
            </div>
            <!-- Topic -->
            <div class="mb-3">
              <label class="form-label fw-bold">Topic</label>
              <input type="text" id="new-topic" class="form-control" />
            </div>
            <!-- Status -->
            <div class="mb-3">
              <label class="form-label fw-bold">Status</label>
              <select id="new-status" class="form-select">
                <option>Pending</option>
                <option>Confirmed</option>
                <option>Cancelled</option>
                <option>Completed</option>
              </select>
            </div>
            <div class="row">
              <!-- Start / End Dates -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Start Date</label>
                <input
                  type="date"
                  id="new-start"
                  class="form-control"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">End Date</label>
                <input
                  type="date"
                  id="new-end"
                  class="form-control"
                />
              </div>
            </div>
            <!-- Location -->
            <div class="mb-3">
              <label class="form-label fw-bold">Location</label>
              <input
                type="text"
                id="new-location"
                class="form-control"
              />
            </div>
            <!-- Link -->
            <div class="mb-3">
              <label class="form-label fw-bold">Link</label>
              <input type="url" id="new-link" class="form-control" />
            </div>
            <!-- Industry -->
            <div class="mb-3">
              <label class="form-label fw-bold">Industry</label>
              <input
                type="text"
                id="new-industry"
                class="form-control"
              />
            </div>
            <!-- Description -->
            <div class="mb-3">
              <label class="form-label fw-bold">Description</label>
              <textarea
                id="new-desc"
                class="form-control"
                rows="3"
              ></textarea>
            </div>
            <!-- Application Deadline -->
            <div class="mb-3">
              <label class="form-label fw-bold">Application Deadline</label>
              <input
                type="date"
                id="new-applicationdeadline"
                class="form-control"
              />
            </div>
            <!-- Internal/External -->
            <div class="mb-3">
              <label class="form-label fw-bold">Internal/External</label>
              <select id="new-type" class="form-select">
                <option>Internal</option>
                <option>External</option>
              </select>
            </div>
            <!-- Assigned Employee -->
            <div class="mb-3">
              <label class="form-label fw-bold">Speaker</label>
              <select id="new-AssignedEmployee" class="form-select">
                <option value="">Select Speaker</option>
              </select>
            </div>
            <!-- Notes -->
            <div class="mb-3">
              <label class="form-label fw-bold">Notes</label>
              <textarea
                id="new-notes"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
          </form>
        </div>
        <!-- Footer / Buttons -->
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-cancel"
            data-bs-dismiss="modal"
            id="cancel-entry-btn"
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-add-new"
            id="submit-entry-btn"
          >
            <i class="bi bi-check-circle me-1"></i> Save
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Entry Modal -->
  <div class="modal fade" id="editEntryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header">
          <h5 class="modal-title">Edit Conference</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <!-- Body / Form -->
        <div class="modal-body">
          <form id="edit-entry-form" novalidate>
            <input type="hidden" id="edit-entry-id" />

            <!-- Title -->
            <div class="mb-3">
              <label class="form-label fw-bold">Title</label>
              <input
                type="text"
                id="edit-title"
                class="form-control"
                required
              />
            </div>

            <!-- Topic -->
            <div class="mb-3">
              <label class="form-label fw-bold">Topic</label>
              <input type="text" id="edit-topic" class="form-control" />
            </div>

            <!-- Status -->
            <div class="mb-3">
              <label class="form-label fw-bold">Status</label>
              <select id="edit-status" class="form-select">
                <option>Pending</option>
                <option>Confirmed</option>
                <option>Cancelled</option>
                <option>Completed</option>
              </select>
            </div>

            <div class="row">
              <!-- Start / End Dates -->
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Start Date</label>
                <input
                  type="date"
                  id="edit-start"
                  class="form-control"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">End Date</label>
                <input
                  type="date"
                  id="edit-end"
                  class="form-control"
                />
              </div>
            </div>

            <!-- Location -->
            <div class="mb-3">
              <label class="form-label fw-bold">Location</label>
              <input
                type="text"
                id="edit-location"
                class="form-control"
              />
            </div>

            <!-- Link -->
            <div class="mb-3">
              <label class="form-label fw-bold">Link</label>
              <input type="url" id="edit-link" class="form-control" />
            </div>

            <!-- Industry -->
            <div class="mb-3">
              <label class="form-label fw-bold">Industry</label>
              <input
                type="text"
                id="edit-industry"
                class="form-control"
              />
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label fw-bold">Description</label>
              <textarea
                id="edit-desc"
                class="form-control"
                rows="3"
              ></textarea>
            </div>

            <!-- Application Deadline -->
            <div class="mb-3">
              <label class="form-label fw-bold">Application Deadline</label>
              <input
                type="date"
                id="edit-applicationdeadline"
                class="form-control"
              />
            </div>

            <!-- Internal/External -->
            <div class="mb-3">
              <label class="form-label fw-bold">Internal/External</label>
              <select id="edit-type" class="form-select">
                <option>Internal</option>
                <option>External</option>
              </select>
            </div>

            <!-- Assigned Employee -->
            <div class="mb-3">
              <label class="form-label fw-bold">Speaker</label>
              <select id="edit-AssignedEmployee" class="form-select">
                <option value="">Select Speaker</option>
              </select>
            </div>

            <!-- Notes -->
            <div class="mb-3">
              <label class="form-label fw-bold">Notes</label>
              <textarea
                id="edit-notes"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
          </form>
        </div>
        <!-- Footer / Buttons -->
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-cancel"
            data-bs-dismiss="modal"
            id="edit-cancel-btn"
          >
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-save"
            id="edit-submit-btn"
          >
            <i class="bi bi-check-circle me-1"></i> Save Changes
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
