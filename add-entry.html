<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add / Edit Entry</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="style.css" rel="stylesheet" />
</head>
<body class="p-4">

  <div class="card mx-auto" style="max-width: 800px;">
    <div class="card-header">
      <h5 class="mb-0">Add Conference</h5>
    </div>
    <div class="card-body">
      <form id="entry-form">
        <!-- Title -->
        <div class="mb-3">
          <label class="form-label fw-bold">Title</label>
          <input type="text" id="new-title" class="form-control" required />
        </div>
        <!-- Topic -->
        <div class="mb-3">
          <label class="form-label fw-bold">Topic</label>
          <input type="text" id="new-topic" class="form-control" />
        </div>
        <!-- Status -->
        <div class="mb-3">
          <label class="form-label fw-bold">Status</label>
          <select id="new-status" class="form-select">
            <option>Pending</option>
            <option>Confirmed</option>
            <option>Cancelled</option>
            <option>Completed</option>
          </select>
        </div>
        <!-- Dates -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Start Date</label>
            <input type="date" id="new-start" class="form-control" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">End Date</label>
            <input type="date" id="new-end" class="form-control" />
          </div>
        </div>
        <!-- Location -->
        <div class="mb-3">
          <label class="form-label fw-bold">Location</label>
          <input type="text" id="new-location" class="form-control" />
        </div>
        <!-- Link -->
        <div class="mb-3">
          <label class="form-label fw-bold">Link</label>
          <input
            type="url"
            id="new-link"
            class="form-control"
            placeholder="https://..."
          />
        </div>
        <!-- Industry -->
        <div class="mb-3">
          <label class="form-label fw-bold">Industry</label>
          <input type="text" id="new-industry" class="form-control" />
        </div>
        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea id="new-desc" class="form-control" rows="2"></textarea>
        </div>
        <!-- Application Deadline -->
        <div class="mb-3">
          <label class="form-label fw-bold">Application Deadline</label>
          <input type="date" id="new-applicationdeadline" class="form-control" />
        </div>
        <!-- Type -->
        <div class="mb-3">
          <label class="form-label fw-bold">Type</label>
          <select id="new-type" class="form-select">
            <option>Internal</option>
            <option>External</option>
          </select>
        </div>
        <!-- Speaker -->
        <div class="mb-3">
          <label class="form-label fw-bold">Speaker</label>
          <select id="new-AssignedEmployee" class="form-select">
            <option value="">Select Speaker</option>
          </select>
        </div>
        <!-- Notes -->
        <div class="mb-3">
          <label class="form-label fw-bold">Notes</label>
          <textarea id="new-notes" class="form-control" rows="2"></textarea>
        </div>
      </form>
    </div>

    <div class="card-footer d-flex justify-content-end gap-2">
      <button type="button" id="cancel-entry-btn" class="btn btn-cancel">
        Cancel
      </button>
      <button type="button" id="submit-entry-btn" class="btn btn-add-new">
        <i class="bi bi-check-circle me-1"></i> Save
      </button>
    </div>
  </div>

  <!-- Bootstrap JS + MSAL + Graph + FullCalendar + Main logic -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://alcdn.msauth.net/browser/2.27.0/js/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/microsoft-graph-client/lib/graph-js-sdk-web.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Load employees list
      if (typeof fetchEmployees === 'function') {
        await fetchEmployees();
      }

      // Determine if we're editing
      const params    = new URLSearchParams(window.location.search);
      const editId    = params.get('editId');
      const isEditing = Boolean(editId);
      const headerH5  = document.querySelector('.card-header h5');
      const saveBtn   = document.getElementById('submit-entry-btn');

      if (isEditing) {
        headerH5.textContent = 'Edit Conference';
        saveBtn.innerHTML     = '<i class="bi bi-pencil me-1"></i> Save Changes';

        // Fetch existing data & populate
        const entry = await fetchEntryById(editId);
        document.getElementById('new-title').value               = entry.title;
        document.getElementById('new-topic').value               = entry.topic;
        document.getElementById('new-status').value              = entry.status;
        document.getElementById('new-start').value               = entry.start;
        document.getElementById('new-end').value                 = entry.end;
        document.getElementById('new-location').value            = entry.location;
        document.getElementById('new-link').value                = entry.link;
        document.getElementById('new-industry').value            = entry.industry;
        document.getElementById('new-desc').value                = entry.desc;
        document.getElementById('new-applicationdeadline').value = entry.applicationdeadline;
        document.getElementById('new-type').value                = entry.internalExternal;
        document.getElementById('new-AssignedEmployee').value    = entry.AssignedEmployee;
        document.getElementById('new-notes').value               = entry.notes;
      }

      // Cancel button
      document.getElementById('cancel-entry-btn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });

      // Save / Submit
      saveBtn.addEventListener('click', async () => {
        if (isEditing) {
          await updateEntry(editId);
        } else {
          await addEntry();
        }
        // Back to list
        clearAddForm();
        window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
