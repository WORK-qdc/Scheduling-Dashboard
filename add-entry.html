<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add New Conference</title>

  <!-- Bootstrap & Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <!-- Your existing styles -->
  <link href="style.css" rel="stylesheet" />
</head>
<body class="d-flex justify-content-center align-items-start py-5">

  <div class="card shadow-sm" style="max-width:600px; width:100%;">
    <!-- Header -->
    <div class="card-header text-white" style="background: #667EEA;">
      <div class="d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Add New Conference</h5>
        <a href="index.html" class="text-white">
          <i class="bi bi-x-lg" style="font-size:1.25rem;"></i>
        </a>
      </div>
    </div>

    <!-- Body / Form -->
    <div class="card-body">
      <form id="add-entry-form" novalidate>
        <!-- Title -->
        <div class="mb-3">
          <label class="form-label fw-bold">Title</label>
          <input type="text" id="new-title" class="form-control" required />
        </div>

        <!-- Topic -->
        <div class="mb-3">
          <label class="form-label fw-bold">Topic</label>
          <input type="text" id="new-topic" class="form-control" />
        </div>

        <!-- Status -->
        <div class="mb-3">
          <label class="form-label fw-bold">Status</label>
          <select id="new-status" class="form-select">
            <option>Pending</option>
            <option>Confirmed</option>
            <option>Cancelled</option>
            <option>Completed</option>
          </select>
        </div>

        <div class="row">
          <!-- Start -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Start Date</label>
            <input type="date" id="new-start" class="form-control" />
          </div>
          <!-- End -->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">End Date</label>
            <input type="date" id="new-end" class="form-control" />
          </div>
        </div>

        <!-- Location -->
        <div class="mb-3">
          <label class="form-label fw-bold">Location</label>
          <input type="text" id="new-location" class="form-control" />
        </div>

        <!-- Link -->
        <div class="mb-3">
          <label class="form-label fw-bold">Link</label>
          <input
            type="url"
            id="new-link"
            class="form-control"
            placeholder="https://..."
          />
        </div>

        <!-- Industry -->
        <div class="mb-3">
          <label class="form-label fw-bold">Industry</label>
          <input type="text" id="new-industry" class="form-control" />
        </div>

        <!-- Description -->
        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea
            id="new-desc"
            class="form-control"
            rows="2"
          ></textarea>
        </div>

        <!-- Application Deadline -->
        <div class="mb-3">
          <label class="form-label fw-bold">Application Deadline</label>
          <input
            type="date"
            id="new-applicationdeadline"
            class="form-control"
          />
        </div>

        <!-- Type -->
        <div class="mb-3">
          <label class="form-label fw-bold">Type</label>
          <select id="new-type" class="form-select">
            <option>Internal</option>
            <option>External</option>
          </select>
        </div>

        <!-- Speaker -->
        <div class="mb-3">
          <label class="form-label fw-bold">Speaker</label>
          <select id="new-AssignedEmployee" class="form-select">
            <option value="">Select Speaker</option>
            <!-- will be populated by populateEmployeeSelects() -->
          </select>
        </div>

        <!-- Notes -->
        <div class="mb-3">
          <label class="form-label fw-bold">Notes</label>
          <textarea id="new-notes" class="form-control" rows="2"></textarea>
        </div>
      </form>
    </div>

    <!-- Footer / Buttons -->
    <div class="card-footer d-flex justify-content-end gap-2">
      <button
        type="button"
        id="cancel-entry-btn"
        class="btn btn-cancel"
      >
        Cancel
      </button>
      <button
        type="button"
        id="submit-entry-btn"
        class="btn btn-add-new"
      >
        <i class="bi bi-check-circle me-1"></i> Save
      </button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
  <!-- Main logic -->
  <script src="main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // populate speaker dropdown on this page:
      if (typeof fetchEmployees === 'function') {
        fetchEmployees();
      }

      // Cancel just navigates back:
      document
        .getElementById('cancel-entry-btn')
        .addEventListener('click', () => {
          window.location.href = 'index.html';
        });

      // Save = call addEntry(), then return:
      document
        .getElementById('submit-entry-btn')
        .addEventListener('click', async () => {
          await addEntry();
          clearAddForm();
          window.location.href = 'index.html';
        });
    });
  </script>
</body>
</html>
